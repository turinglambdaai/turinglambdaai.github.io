name: Public site structural check

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "README*.md"
      - "docs/PUBLIC-PRESENTATION*.md"
      - "scripts/check_public_surface.py"
      - ".github/workflows/public-site-check.yml"
  push:
    branches: [master]
    paths:
      - "index.html"
      - "assets/**"
      - "README*.md"
      - "docs/PUBLIC-PRESENTATION*.md"
      - "scripts/check_public_surface.py"
      - ".github/workflows/public-site-check.yml"

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local homepage structure and content entry points
        run: python3 scripts/check_public_surface.py
